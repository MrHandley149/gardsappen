<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Gårdsappen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #ffffff; color: #111111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
        .container { width: 100%; max-width: 340px; }
        h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
        .subtitle { font-size: 15px; color: #666666; margin-bottom: 36px; line-height: 1.4; }
        input {
            width: 100%;
            height: 64px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 10px;
            text-align: center;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            background: #fafafa;
            color: #111111;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #111111; background: #ffffff; }
        button {
            width: 100%;
            height: 56px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        button:active { transform: scale(0.99); }
        button:disabled { opacity: 0.45; cursor: default; }
        .btn-primary { background: #111111; color: #ffffff; border: none; margin-top: 16px; }
        .btn-ghost { background: transparent; color: #111111; border: none; margin-top: 24px; height: 48px; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
        .status { min-height: 24px; margin-top: 16px; font-size: 14px; font-weight: 600; text-align: center; color: #666666; }
        .status.error { color: #d32f2f; }
        .status.ok { color: #2e7d32; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Gårdsappen</h1>
        <p class="subtitle">Ange dagens sexsiffriga kod för att öppna appen.</p>

        <form id="lock-form" autocomplete="off">
            <input
                id="code"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="000000"
                required
                autofocus
            >
            <button type="submit" id="unlock-btn" class="btn-primary">Lås upp</button>
        </form>

        <p id="status" class="status"></p>

        <button type="button" id="send-btn" class="btn-ghost">Skicka dagens kod</button>
    </main>

    <script>
        const form = document.getElementById('lock-form');
        const codeInput = document.getElementById('code');
        const unlockBtn = document.getElementById('unlock-btn');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');

        function setStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        // Om dagens session redan är aktiv, gå direkt in i appen
        fetch('/api/verify')
            .then(r => r.json())
            .then(data => { if (data.authorized) window.location.replace('/api/app'); })
            .catch(() => {});

        // Tillåt bara siffror i fältet
        codeInput.addEventListener('input', () => {
            codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
        });

        sendBtn.addEventListener('click', async () => {
            sendBtn.disabled = true;
            setStatus('Skickar kod...');
            try {
                const res = await fetch('/api/send-code', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    setStatus('Dagens kod är skickad.', 'ok');
                } else {
                    setStatus(data.error || 'Kunde inte skicka kod.', 'error');
                }
            } catch {
                setStatus('Nätverksfel. Försök igen.', 'error');
            } finally {
                setTimeout(() => { sendBtn.disabled = false; }, 3000);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = codeInput.value.trim();
            if (code.length !== 6) {
                setStatus('Koden måste vara 6 siffror.', 'error');
                return;
            }

            unlockBtn.disabled = true;
            setStatus('Kontrollerar...');
            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (res.ok && data.redirect) {
                    window.location.replace(data.redirect);
                } else {
                    setStatus(data.error || 'Fel kod.', 'error');
                    codeInput.select();
                    unlockBtn.disabled = false;
                }
            } catch {
                setStatus('Nätverksfel. Försök igen.', 'error');
                unlockBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
